name: Weekly Menu Sync

on:
  schedule:
    # Monday 04:00 UTC = Monday 00:00 EDT / Sunday 23:00 EST; dispatch may be delayed.
    - cron: '0 4 * * 1'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: weekly-menu-sync-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Puppeteer browsers
        run: npx puppeteer browsers install

      - name: Validate config and isolate this run's scrape output
        id: prepare
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/sync/workflow-guard.mjs prepare

      - name: Run all scrapers
        id: scrape
        run: npm run scrape:all -- --skip-dfb
        continue-on-error: true

      - name: Check scraped output
        id: check_scraped
        env:
          SCRAPE_OUTCOME: ${{ steps.scrape.outcome }}
        run: |
          node scripts/sync/workflow-guard.mjs check

      - name: Merge with database
        id: merge
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run sync:merge

      - name: Estimate nutrition
        id: estimate
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run sync:estimate

      - name: Generate diff report
        id: report
        run: npm run sync:report

      - name: Auto-approve high-confidence items
        id: approve
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        # No continue-on-error: a failed import (approve sets a non-zero exit on
        # errors, or the volume circuit-breaker trips) should fail the run loudly.
        run: npm run sync:approve -- --auto

      - name: Record sync outcome
        if: always()
        env:
          STAGE_OUTCOMES: >-
            {"prepare":"${{ steps.prepare.outcome }}","scrape":"${{ steps.scrape.outcome }}","check":"${{ steps.check_scraped.outcome }}","merge":"${{ steps.merge.outcome }}","estimate":"${{ steps.estimate.outcome }}","report":"${{ steps.report.outcome }}","approve":"${{ steps.approve.outcome }}"}
        run: node scripts/sync/workflow-guard.mjs finish

      - name: Upload report + pending artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Curated review artifacts only. Raw scraped/approved data is NOT
          # committed to the repo — Supabase is the source of truth, and those
          # paths stay gitignored (force-committing them previously overrode the
          # ignore rules and defeated the secret-leak backstop).
          name: menu-sync-report-${{ github.run_id }}
          path: |
            data/pending/workflow-receipt.json
            data/pending/report-*.md
            data/pending/report-*.json
            data/pending/estimated-*.json
          retention-days: 30
