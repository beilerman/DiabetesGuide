name: Daily Audit

on:
  schedule:
    # 06:00 UTC daily = 02:00 EDT / 01:00 EST; GitHub dispatch may be delayed.
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: daily-audit-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run audit pipeline
        id: pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run audit:pipeline
        continue-on-error: true

      - name: Run external checks
        id: external
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run audit:external
        continue-on-error: true

      - name: Run quality report
        id: quality
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run audit:quality
        continue-on-error: true

      - name: Monitor certified nutrition evidence
        id: evidence
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run evidence:monitor -- --apply-checks
        continue-on-error: true

      - name: Record required audit outcomes
        id: audit_outcome
        if: always()
        env:
          STAGE_OUTCOMES: >-
            {"pipeline":"${{ steps.pipeline.outcome }}","external":"${{ steps.external.outcome }}","quality":"${{ steps.quality.outcome }}","evidence":"${{ steps.evidence.outcome }}"}
        run: node scripts/sync/workflow-guard.mjs audit

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-report-${{ github.run_id }}
          path: |
            audit/workflow-receipt.json
            audit/accuracy-results.json
            audit/completeness-results.json
            audit/autofix-results.json
            audit/external-results.json
            audit/quality-results.json
            audit/fidelity-results.json
            audit/evidence-monitor-results.json
            audit/daily/*.md
          retention-days: 30

      - name: Commit audit results
        if: steps.audit_outcome.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add audit/graduation-state.json audit/daily/ audit/quality-history.json || true
          # Only the "nothing to commit" case is tolerated; a real push failure
          # should surface rather than being silently swallowed by `|| true`.
          if git diff --cached --quiet; then
            echo "No audit changes to commit."
          else
            git commit -m "audit: daily run $(date +%Y-%m-%d) [skip ci]"
            git push
          fi
